name: llm-grader-codex-dev

services:
  codex-dev:
    build:
      context: .
      dockerfile: Dockerfile.codex
      args:
        CODEX_BASE_IMAGE: ${CODEX_BASE_IMAGE:-ghcr.io/openai/codex-universal:latest}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.159.1}
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    image: local/llm-grader-codex-dev:${CODEX_CLI_VERSION:-0.159.1}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /opt/llm-scoring
    environment:
      HOME: /home/codex
      CODEX_HOME: /home/codex/.codex
      CODEX_ENV_PYTHON_VERSION: "3.12"
      CODEX_ENV_NODE_VERSION: "22"
      NVM_DIR: /root/.nvm
      PYENV_ROOT: /root/.pyenv
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers
      PIP_CACHE_DIR: /home/codex/.cache/pip
      NPM_CONFIG_CACHE: /home/codex/.cache/npm
      GIT_CONFIG_GLOBAL: /home/codex/.codex/gitconfig
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    entrypoint: ["/usr/local/bin/codex-dev-entrypoint"]
    command: ["sleep", "infinity"]
    init: true
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-13000}:3000"
      - "127.0.0.1:${DEV_API_PORT:-18080}:8000"
    volumes:
      - type: bind
        source: .
        target: /opt/llm-scoring
      - codex_home:/home/codex/.codex
      - codex_python_env:/opt/codex-venv
      - codex_cache:/home/codex/.cache
      - frontend_node_modules:/opt/llm-scoring/frontend/node_modules
      - frontend_next:/opt/llm-scoring/frontend/.next
    networks:
      - dev
    restart: unless-stopped

  postgres-dev:
    image: postgres:16-alpine
    profiles: ["database"]
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-llm_grader_dev}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-llm_grader_dev}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-llm-grader-dev-only}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  dev:
    name: llm-grader-codex-dev

volumes:
  codex_home:
  codex_python_env:
  codex_cache:
  frontend_node_modules:
  frontend_next:
  postgres_dev_data:
