[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-answer-scoring"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyMuPDF==1.28.2"]

[project.optional-dependencies]
pdf = []
dev = ["ruff==0.11.13"]

[project.scripts]
score-exam = "scoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
