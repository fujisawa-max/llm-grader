services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_grader}
      POSTGRES_USER: ${POSTGRES_USER:-llm_grader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      LLM_GRADER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-llm_grader}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_grader}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic -x sqlalchemy.url=$${LLM_GRADER_DATABASE_URL} upgrade head"]
    restart: "no"

  runtime-manager:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        LLAMA_SERVER_IMAGE: ${LLAMA_SERVER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b9265}
        LLAMA_CUDA_IMAGE: ${LLAMA_CUDA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b9265}
    environment:
      LLM_GRADER_RUNTIME_CONFIG: /etc/llm-grader/runtime.json
      LLM_GRADER_RUNTIME_BACKEND: ${LLM_GRADER_RUNTIME_BACKEND:-auto}
      LLM_GRADER_ROCM_BINARY: ${LLM_GRADER_ROCM_BINARY:-}
      LLM_GRADER_MATH_MODEL_ID: ${LLM_GRADER_MATH_MODEL_ID:-unimumer-q4}
      LLM_GRADER_MATH_MODEL_PATH: ${LLM_GRADER_MATH_MODEL_PATH:-/models/math-ocr.gguf}
      LLM_GRADER_MATH_MMPROJ_PATH: ${LLM_GRADER_MATH_MMPROJ_PATH:-/models/math-ocr-mmproj.gguf}
      LLM_GRADER_LLM_MODEL_ID: ${LLM_GRADER_LLM_MODEL_ID:-local-text-model}
      LLM_GRADER_LLM_MODEL_PATH: ${LLM_GRADER_LLM_MODEL_PATH:-/models/model.gguf}
      LLM_GRADER_RUNTIME_ADVERTISE_HOST: runtime-manager
    volumes:
      - ${LLM_MODELS_DIR:-llm_models}:/models
      - runtime_manager_state:/runtime-state
      - ${LLM_GRADER_RUNTIME_CONFIG_FILE:-./config/runtime.deployment.json}:/etc/llm-grader/runtime.json:ro
    networks:
      - runtime-internal
    healthcheck:
      test: ["CMD", "python", "-m", "scoring.runtime.server", "--healthcheck", "http://127.0.0.1:18000/internal/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      LLM_GRADER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-llm_grader}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_grader}
      LLM_GRADER_ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/data/artifacts}
      LLM_GRADER_QUESTION_IMPORT_ROOT: ${ARTIFACT_ROOT:-/data/artifacts}/question-imports
      LLM_GRADER_ALLOWED_ROOTS: ${ARTIFACT_ROOT:-/data/artifacts}
      LLM_GRADER_ALLOW_HEADER_AUTH: ${LLM_GRADER_ALLOW_HEADER_AUTH:-false}
      LLM_GRADER_COOKIE_SECURE: ${LLM_GRADER_COOKIE_SECURE:-false}
      LLM_GRADER_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      STUDENT_PORTAL_ENABLED: ${STUDENT_PORTAL_ENABLED:-false}
      LLM_GRADER_RUNTIME_MANAGER_URL: http://runtime-manager:18000/internal
      LLM_GRADER_RUNTIME_START_TIMEOUT_SECONDS: ${LLM_GRADER_RUNTIME_START_TIMEOUT_SECONDS:-330}
      LLM_GRADER_RUNTIME_MANAGER_TIMEOUT_SECONDS: ${LLM_GRADER_RUNTIME_MANAGER_TIMEOUT_SECONDS:-120}
      LLM_GRADER_TRUSTED_RUNTIME_HOSTS: runtime-manager
      LLM_GRADER_MODEL_ANSWER_CLASSIFIER_PROFILE: ${LLM_GRADER_MODEL_ANSWER_CLASSIFIER_PROFILE:-ornith_rubric_draft}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - artifacts_data:/data/artifacts
    networks:
      - default
      - runtime-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        API_PROXY_TARGET: http://api:8000
        API_PROXY_TIMEOUT_MS: ${API_PROXY_TIMEOUT_MS:-900000}
    environment:
      API_PROXY_TIMEOUT_MS: ${API_PROXY_TIMEOUT_MS:-900000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  artifacts_data:
  llm_models:
  runtime_manager_state:

networks:
  runtime-internal:
    internal: true
